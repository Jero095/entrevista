server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con la dirección en una variable, nginx la resuelve en
    # cada petición: arranca aunque la API se reinicie y cambie de IP.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    # Llamadas a la API (mismo origen para el navegador: no hace falta CORS).
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Estado del servicio y documentación interactiva (Swagger) de la API.
    location ~ ^/(health|docs|redoc|openapi\.json)$ {
        proxy_pass $api;
    }

    # Aplicación de una sola página: cualquier otra ruta sirve index.html.
    location / {
        try_files $uri /index.html;
    }
}
