services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"                      # acepta la licencia de SQL Server (edición Developer)
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Se ejecuta una vez: crea el esquema y el usuario de la API (idempotente) y carga el CSV.
  etl:
    build: .
    command: sh -c "python -m etl init-db && python -m etl load --input data/raw/alarms.csv"
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      DB_API_USER: ${DB_API_USER:-api_lectura}
      DB_API_PASSWORD: ${DB_API_PASSWORD:?Defina DB_API_PASSWORD en .env}
    volumes:
      - ./data:/app/data           # permite regenerar el CSV sin reconstruir la imagen
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Misma imagen que el ETL, distinto comando. Arranca cuando el ETL terminó bien.
  # Solo recibe las credenciales de solo lectura: nunca la contraseña de 'sa'.
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: db
      DB_API_USER: ${DB_API_USER:-api_lectura}
      DB_API_PASSWORD: ${DB_API_PASSWORD}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      etl:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mssql-data:
