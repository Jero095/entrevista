[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/W: estilo PEP 8 · F: errores (imports sin usar, nombres indefinidos) · B: bugs probables
# UP: sintaxis moderna de Python · SIM: simplificaciones · I: orden de imports
select = ["E", "W", "F", "B", "UP", "SIM", "I"]
# Pydantic usa Generic[T] en sus ejemplos oficiales; la sintaxis PEP 695 no aporta aquí.
ignore = ["UP046"]
